{% extends 'base.html' %}

{% block title %}Password Changed - LoveConnect{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="fas fa-check-circle"></i> Password Changed</h4>
            </div>
            <div class="card-body text-center">
                <i class="fas fa-shield-alt fa-4x text-success mb-3"></i>
                <h4>Password Changed Successfully!</h4>
                <p class="text-muted">Your password has been updated successfully.</p>
                <div class="d-grid gap-2">
                    <a href="{% url 'users:settings' %}" class="btn btn-primary">
                        <i class="fas fa-cog"></i> Back to Settings
                    </a>
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-primary">
                        <i class="fas fa-home"></i> Go to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
